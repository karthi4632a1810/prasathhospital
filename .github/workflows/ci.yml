name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-verify:
    name: Backend — verify suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run verify
        working-directory: backend
      - run: npm run lint
        working-directory: backend

  frontend-public-build:
    name: frontend-public — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-public/package-lock.json
      - run: npm ci
        working-directory: frontend-public
      - run: npm run lint
        working-directory: frontend-public
      - run: npm run lint:css
        working-directory: frontend-public
      - run: npm run build
        working-directory: frontend-public

  frontend-admin-build:
    name: frontend-admin — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-admin/package-lock.json
      - run: npm ci
        working-directory: frontend-admin
      - run: npm run lint
        working-directory: frontend-admin
      - run: npm run lint:css
        working-directory: frontend-admin
      - run: npm run build
        working-directory: frontend-admin

  docker-build:
    name: Docker — all images build
    runs-on: ubuntu-latest
    needs: [backend-verify, frontend-public-build, frontend-admin-build]
    steps:
      - uses: actions/checkout@v4
      - run: cp backend/.env.example backend/.env
      - run: docker compose build
