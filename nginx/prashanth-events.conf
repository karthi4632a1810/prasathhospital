# =============================================================================
# NGINX — Prashanth Hospitals Event Management Platform
#
# Serves the public microsite (React SPA) and reverse-proxies /api to Node.
# Place at /etc/nginx/sites-available/prashanth-events.conf and symlink into
# sites-enabled. Run `nginx -t` before reloading.
# =============================================================================

# Rate limit zone for API traffic (burst-tolerant; the app also rate-limits).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream prashanth_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

# ---------- HTTP -> HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name events.prashanthhospitals.com;

    # Certbot renewal challenge must stay on HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name events.prashanthhospitals.com;

    # --- TLS (paths produced by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/events.prashanthhospitals.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/events.prashanthhospitals.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # CSP: allows Google Fonts and the Maps iframe used by the venue section.
    # Extend script-src when the payment gateway SDK lands in Module 6
    # (no third-party scripts — the payment gateway was removed).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; frame-src https://www.google.com https://maps.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Uploads (speaker photos, sponsor logos from the CMS) ---
    client_max_body_size 12M;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/rss+xml image/svg+xml font/woff font/woff2;

    # =========================================================================
    # API
    # =========================================================================
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass         http://prashanth_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Never cache API responses — seat counts and ticket availability are live.
        proxy_no_cache     1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # CMS uploads (speaker photos, sponsor logos) live on the API. ^~ beats
    # the image-extension regex below, which would otherwise look for them
    # in the static root and 404.
    location ^~ /uploads/ {
        proxy_pass         http://prashanth_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    # =========================================================================
    # Static SPA
    # =========================================================================
    root /var/www/prashanth-events/public;
    index index.html;

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached, or delegates see a stale bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Client-side routing: /events/<slug> is resolved by React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Logs ---
    access_log /var/log/nginx/prashanth-events.access.log;
    error_log  /var/log/nginx/prashanth-events.error.log warn;
}
