# =============================================================================
# PRODUCTION stack — Hostinger VPS (194.238.22.210)
#
# Port series (conflict-free with other containers on the VPS):
#   1008 → Public website (CIIM 2026)
#   1009 → Admin dashboard
#   2008 → Backend API (localhost only — Nginx proxies to it)
#
# Uses MongoDB Atlas (cloud) — no local mongo container needed.
#
# Quick start:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec api npm run seed
#   docker compose -f docker-compose.prod.yml exec api npm run seed:admin
# =============================================================================

services:
  api:
    build:
      context: ./backend
    container_name: pg_student_biomatrix_backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env.production
        required: false
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb+srv://jiokarthikeyan18_db_user:Oe8OhnOrD164A0dJ@prashantdb.ma6fim0.mongodb.net/prashanth_events?retryWrites=true&w=majority}
      JWT_SECRET: ${JWT_SECRET:-prashanth-ciim-2026-production-jwt-token-secret-key-v1}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://ciim.prashanthfertility.com}
      API_BASE_URL: ${API_BASE_URL:-https://ciim.prashanthfertility.com}
      ADMIN_SITE_URL: ${ADMIN_SITE_URL:-https://ciimadmin.prashanthfertility.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ciim.prashanthfertility.com,https://ciimadmin.prashanthfertility.com,https://ciim.prashanthhospitals.com,https://ciimadmin.prashanthhospitals.com}
      TRUST_PROXY: 1
      UPLOAD_DIR: /app/uploads
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@prashanthhospitals.com}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-admin@prashanth}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-Platform Admin}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-infociim@pfrcivf.com}
      SMTP_PASS: ${SMTP_PASS:-uwjelibmbogyeokw}
      SMTP_APP_PASS: ${SMTP_APP_PASS:-uwjelibmbogyeokw}
      MAIL_FROM: ${MAIL_FROM:-CIIM 2026 <infociim@pfrcivf.com>}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-infociim@pfrcivf.com}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-wati}
      WATI_BASE_URL: ${WATI_BASE_URL:-https://live-mt-server.wati.io/1080787}
      WATI_ACCESS_TOKEN: ${WATI_ACCESS_TOKEN:-Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..K1hkIPZQ1mNI6nlyTKSQ5hK81Z6RTift8ZdgvyKIXrQ}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-ciim2026_registration_1}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-en_GB}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - '127.0.0.1:2008:5000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./frontend-public
      args:
        VITE_API_BASE_URL: ''
    container_name: pg_student_biomatrix_frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '1008:80'

  admin:
    build:
      context: ./frontend-admin
      args:
        VITE_API_BASE_URL: ''
        VITE_PUBLIC_SITE_URL: 'https://ciim.prashanthfertility.com'
    container_name: pg_student_biomatrix_admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '1009:80'

volumes:
  uploads_data:
