# =============================================================================
# Local / staging stack: MongoDB + API + built microsite + admin dashboard,
# all behind NGINX.
#
#   cp backend/.env.example backend/.env    # then edit
#   docker compose up --build
#   docker compose exec api npm run seed
#   docker compose exec api npm run seed:admin
#
# Microsite: http://localhost:8080   API: http://localhost:8080/api/v1/health
# Admin:     http://localhost:8082
# =============================================================================

services:
  mongo:
    image: mongo:7
    container_name: prashanth-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: prashanth_events
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./backend
    container_name: prashanth-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # Secrets (JWT_SECRET, SMTP_*, WHATSAPP_*, ADMIN_BOOTSTRAP_*) live in
    # backend/.env so they never need hand-listing here; structural values
    # that differ between this compose file and plain `npm run dev` stay
    # explicit below and win over the file.
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/prashanth_events
      PUBLIC_SITE_URL: http://localhost:8080
      API_BASE_URL: http://localhost:8080
      ADMIN_SITE_URL: http://localhost:8082
      CORS_ORIGINS: http://localhost:8080,http://localhost:8082
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    expose:
      - '5000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./frontend-public
      args:
        # Empty base URL -> the SPA calls /api on its own origin, which NGINX proxies.
        VITE_API_BASE_URL: ''
    container_name: prashanth-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8080:80'

  admin:
    build:
      context: ./frontend-admin
      args:
        VITE_API_BASE_URL: ''
        VITE_PUBLIC_SITE_URL: 'http://localhost:8080'
    container_name: prashanth-admin
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8082:80'

volumes:
  mongo_data:
  uploads_data:
